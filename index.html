<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUD Configurator | BLE</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #0F172A;
      --surface: rgba(30, 41, 59, 0.7);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --glass-border: rgba(255, 255, 255, 0.1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: radial-gradient(circle at top right, #1E1B4B, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.5s ease-out;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      background: linear-gradient(135deg, #60A5FA, #A78BFA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      appearance: none;
      outline: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .status-box {
      margin-top: 32px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 14px;
      text-align: center;
      color: #FBBF24;
      display: none;
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #334155;
      color: #94A3B8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>HUD Configurator</h1>
    <p class="subtitle">Kết nối và thiết lập tham số qua Bluetooth</p>

    <div class="form-group">
      <label for="appSelect">Ứng dụng (App Mode)</label>
      <select id="appSelect">
        <option value="0">GOFA (Mặc định)</option>
        <option value="1">Waze</option>
        <option value="2">Vietmap Live</option>
        <option value="3">Lilybox</option>
      </select>
    </div>

    <div class="form-group">
      <label for="carSelect">Dòng xe (Car Profile)</label>
      <select id="carSelect">
        <option value="0">KIA / Hyundai Classic (Tucson 18-20)</option>
        <option value="1">KIA / Hyundai CAN FD (Sorento 22+)</option>
        <option value="2">Hyundai Santafe 2021</option>
        <option value="3">Hyundai Palisade</option>
        <option value="4">Mazda CX-5</option>
        <option value="5">Ford (Everest/Ranger)</option>
        <option value="6">Mitsubishi Pajero / Outlander</option>
        <option value="7">Peugeot 5008</option>
      </select>
    </div>

    <button id="connectBtn">Kết Nối & Ghi Cấu Hình</button>

    <div id="status" class="status-box"></div>
  </div>

  <script>
    const CONFIG_SERVICE_UUID = "4FAFC201-1FB5-459E-8FCC-C5C9C331914B".toLowerCase();
    const CONFIG_CHAR_UUID    = "4FAFC202-1FB5-459E-8FCC-C5C9C331914B".toLowerCase();

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const appSelect = document.getElementById('appSelect');
    const carSelect = document.getElementById('carSelect');

    function log(message, color = '#FBBF24') {
      statusDiv.style.display = 'block';
      statusDiv.style.color = color;
      statusDiv.innerText = message;
    }

    connectBtn.addEventListener('click', async () => {
      try {
        log('Đang tìm kiếm HUD...', '#60A5FA');
        connectBtn.disabled = true;

        // Quét thiết bị có chứa CONFIG_SERVICE_UUID (Dù tên là gì đi nữa)
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [CONFIG_SERVICE_UUID] }]
        });

        log(`Đang kết nối tới ${device.name || 'HUD'}...`, '#60A5FA');
        
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(CONFIG_SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CONFIG_CHAR_UUID);

        // Lấy dữ liệu từ Select box
        const appVal = parseInt(appSelect.value);
        const carVal = parseInt(carSelect.value);

        // Tạo mảng 2 byte
        const data = new Uint8Array([appVal, carVal]);

        log('Đang ghi cấu hình vào Flash...', '#60A5FA');
        await characteristic.writeValue(data);

        log('Thành công! Mạch đang khởi động lại...', '#34D399');
        
        // Ngắt kết nối sau khi ghi xong
        setTimeout(() => {
          if (device.gatt.connected) device.gatt.disconnect();
          connectBtn.disabled = false;
        }, 1500);

      } catch (error) {
        console.error(error);
        log('Lỗi: ' + error.message, '#F87171');
        connectBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
