<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUD Configurator | BLE</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #0F172A;
      --surface: rgba(30, 41, 59, 0.7);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --glass-border: rgba(255, 255, 255, 0.1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: radial-gradient(circle at top right, #1E1B4B, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.5s ease-out;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      background: linear-gradient(135deg, #60A5FA, #A78BFA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      appearance: none;
      outline: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .status-box {
      margin-bottom: 24px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 14px;
      text-align: center;
      color: #94A3B8;
      transition: all 0.3s;
      border: 1px solid transparent;
    }

    .status-box.connected {
      background: rgba(16, 185, 129, 0.1);
      color: #34D399;
      border-color: rgba(16, 185, 129, 0.2);
    }

    button {
      width: 100%;
      padding: 16px;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-connect {
      background: #3B82F6;
      box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
      margin-bottom: 24px;
    }

    .btn-connect:hover {
      background: #2563EB;
      transform: translateY(-2px);
    }

    .btn-save {
      background: var(--primary);
      box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
    }

    .btn-save:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #334155 !important;
      color: #94A3B8 !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
      transform: none !important;
    }

    .config-section {
      display: none;
      animation: fadeIn 0.5s ease-out;
    }
    
    .config-section.visible {
      display: block;
    }

    .log-text {
      margin-top: 24px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>HUD Configurator</h1>
    <p class="subtitle">Kết nối và thiết lập tham số qua Bluetooth</p>

    <div class="status-box" id="statusBox">
      🔴 Chưa kết nối
    </div>

    <button id="connectBtn" class="btn-connect">🔍 Tìm & Kết Nối Thiết Bị</button>

    <div id="configSection" class="config-section">
      <div class="form-group">
        <label for="appSelect">Ứng dụng (App Mode)</label>
        <select id="appSelect">
          <option value="0">GOFA (Mặc định)</option>
          <option value="1">Waze</option>
          <option value="2">Vietmap Live</option>
          <option value="3">Lilybox</option>
        </select>
      </div>

      <div class="form-group">
        <label for="carSelect">Dòng xe (Car Profile)</label>
        <select id="carSelect">
          <option value="0">KIA / Hyundai Classic (Tucson 18-20)</option>
          <option value="1">KIA / Hyundai CAN FD (Sorento 22+)</option>
          <option value="2">Hyundai Santafe 2021</option>
          <option value="3">Hyundai Palisade</option>
          <option value="4">Mazda CX-5</option>
          <option value="5">Ford (Everest/Ranger)</option>
          <option value="6">Mitsubishi Pajero / Outlander</option>
          <option value="7">Peugeot 5008</option>
        </select>
      </div>

      <button id="saveBtn" class="btn-save">💾 Lưu & Khởi động lại</button>
    </div>

    <div id="log" class="log-text"></div>
  </div>

  <script>
    const CONFIG_SERVICE_UUID = "4FAFC201-1FB5-459E-8FCC-C5C9C331914B".toLowerCase();
    const CONFIG_CHAR_UUID    = "4FAFC202-1FB5-459E-8FCC-C5C9C331914B".toLowerCase();

    const connectBtn = document.getElementById('connectBtn');
    const saveBtn = document.getElementById('saveBtn');
    const statusBox = document.getElementById('statusBox');
    const configSection = document.getElementById('configSection');
    const logText = document.getElementById('log');
    const appSelect = document.getElementById('appSelect');
    const carSelect = document.getElementById('carSelect');

    let bleDevice = null;
    let bleServer = null;
    let configChar = null;

    function showLog(message, color = '#94A3B8') {
      logText.style.display = 'block';
      logText.style.color = color;
      logText.innerText = message;
    }

    // Nút 1: Tìm và kết nối
    connectBtn.addEventListener('click', async () => {
      try {
        if (bleDevice && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
          return;
        }

        showLog('Đang mở cửa sổ quét Bluetooth...', '#60A5FA');

        // Bật popup quét của Chrome (Hiện tất cả thiết bị để dễ dàng tìm thấy)
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [CONFIG_SERVICE_UUID]
        });

        // Bắt sự kiện ngắt kết nối
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        showLog(`Đang kết nối tới ${bleDevice.name || 'HUD'}...`, '#60A5FA');
        
        let retries = 3;
        while (retries > 0) {
          try {
            bleServer = await bleDevice.gatt.connect();
            break; // Kết nối thành công thì thoát loop
          } catch (e) {
            retries--;
            if (retries === 0) throw e;
            showLog(`Lỗi kết nối. Đang thử lại... (${retries} lần nữa)`, '#FBBF24');
            await new Promise(r => setTimeout(r, 1000));
          }
        }

        // Chờ thêm 500ms để GATT ổn định trên điện thoại
        await new Promise(r => setTimeout(r, 500));

        const service = await bleServer.getPrimaryService(CONFIG_SERVICE_UUID);
        configChar = await service.getCharacteristic(CONFIG_CHAR_UUID);

        // Update UI khi kết nối thành công
        statusBox.innerHTML = `🟢 Đã kết nối: <b>${bleDevice.name || 'HUD Mạch Kín'}</b>`;
        statusBox.classList.add('connected');
        connectBtn.innerText = "Ngắt kết nối";
        configSection.classList.add('visible');
        showLog('Kết nối thành công! Mời chọn cấu hình.', '#34D399');

      } catch (error) {
        console.error(error);
        if (error.name === 'NotFoundError') {
          showLog('Bạn đã hủy quét hoặc không tìm thấy thiết bị.', '#94A3B8');
        } else if (error.name === 'NetworkError') {
          showLog('Lỗi kết nối (NetworkError): Vui lòng tắt/bật lại Bluetooth trên điện thoại, gỡ ghép nối thiết bị cũ và thử lại!', '#F87171');
        } else if (error.name === 'SecurityError') {
          showLog('Lỗi bảo mật: Trình duyệt không có quyền dùng Bluetooth.', '#F87171');
        } else {
          showLog(`Lỗi [${error.name}]: ${error.message}`, '#F87171');
        }
      }
    });

    // Hàm xử lý khi bị ngắt kết nối (Bluetooth rớt hoặc mạch reset)
    function onDisconnected() {
      statusBox.innerHTML = `🔴 Chưa kết nối`;
      statusBox.classList.remove('connected');
      connectBtn.innerText = "🔍 Tìm & Kết Nối Thiết Bị";
      configSection.classList.remove('visible');
      bleDevice = null;
      bleServer = null;
      configChar = null;
      showLog('Thiết bị đã ngắt kết nối.', '#94A3B8');
    }

    // Nút 2: Ghi cấu hình
    saveBtn.addEventListener('click', async () => {
      if (!configChar) {
        showLog('Lỗi: Chưa kết nối hoặc mất kết nối!', '#F87171');
        return;
      }

      try {
        const appVal = parseInt(appSelect.value);
        const carVal = parseInt(carSelect.value);

        // Tạo mảng 2 byte (App, Car)
        const data = new Uint8Array([appVal, carVal]);

        showLog('Đang lưu vào Flash của ESP32...', '#FBBF24');
        saveBtn.disabled = true;
        saveBtn.innerText = "Đang lưu...";

        await configChar.writeValue(data);

        showLog('✅ LƯU THÀNH CÔNG! Mạch đang tự khởi động lại...', '#34D399');
        statusBox.innerHTML = `🟠 Đang khởi động lại mạch...`;
        
        // Mạch sẽ tự khởi động lại (ESP.restart) nên GATT sẽ tự động kích hoạt onDisconnected
        setTimeout(() => {
          saveBtn.disabled = false;
          saveBtn.innerText = "💾 Lưu & Khởi động lại";
        }, 2000);

      } catch (error) {
        console.error(error);
        showLog('Lỗi khi ghi dữ liệu: ' + error.message, '#F87171');
        saveBtn.disabled = false;
        saveBtn.innerText = "💾 Lưu & Khởi động lại";
      }
    });
  </script>
</body>
</html>
